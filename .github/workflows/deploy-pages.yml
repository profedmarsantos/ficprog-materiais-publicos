name: Publicar site estático no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Instalar Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Validar materiais e bancos Moodle
        shell: pwsh
        run: ./scripts/Test-ModulePackage.ps1
      - name: Gerar site a partir dos HTML canonicos
        shell: pwsh
        run: ./.github/scripts/Build-Publication.ps1
      - name: Empacotar pasta publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: publicacao
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
